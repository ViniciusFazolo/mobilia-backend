spring.application.name=mobilia
# Use este formato que separa bem as variáveis para não haver erro de digitação
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# Garante que o Hibernate não tente adivinhar nada antes da hora
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB

SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=20MB

SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=20MB

SERVER_TOMCAT_MAX_SWALLOW_SIZE=20MB

